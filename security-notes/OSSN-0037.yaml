id: OSSN-0037

title: Configure Horizon to mitigate BREACH/CRIME attacks

# Backfilled from the OSSN/OSSN-0037 wiki page creation date. The
# Security_Notes wiki index gives 2013-09-19, contradicted by both
# the page history and the git merge date (2014-10-20)
date: '2014-10-21'

affected-services: Horizon, Django, Apache, Nginx, SSL, TLS

summary: >
  Horizon is vulnerable to BREACH/CRIME style chosen plaintext attacks in it's default configuration.


discussion: |
  The BREACH attack may be used to compromise Django's cross-site request forgery (CSRF) protection. OpenStack's Horizon web dashboard is built on the Django framework, and is consequently affected. There is no fix available in Horizon itself, but there are protection options.

  BREACH takes advantage of vulnerabilities when serving compressed data over SSL/TLS.


recommended-actions: |
  Since BREACH is related to serving compressed data, disabling
  compression of web responses can be used to mitigate these type of
  attacks. Some methods for this include:

  Disable Django's GZIP Middleware:
  https://docs.djangoproject.com/en/dev/ref/middleware/#module-django.middleware.gzip

  Disable GZip compression in your web server's config. For Apache httpd,
  you can do this by disabling ``mod_deflate``:
  http://httpd.apache.org/docs/2.2/mod/mod_deflate.html

  For Nginx, you can do this by disabling the gzip module:
  http://wiki.nginx.org/HttpGzipModule

