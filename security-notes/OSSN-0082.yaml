id: OSSN-0082

title: Heap and Stack based buffer overflows in dnsmasq prior to version 2.78

# Backfilled from the OSSN/OSSN-0082 wiki page creation date
date: '2017-10-04'

affected-services: Any neutron based OpenStack deployment on a version of dnsmasq prior to 2.78.

summary: >
  A series of heap and stack based buffer overflows have been discovered
  in versions of dnsmasq prior to release 2.78.

discussion: |
  The following attack vectors have been assigned the following CVE
  numbers:

  - CVE-2017-14491
  - CVE-2017-14492
  - CVE-2017-14493
  - CVE-2017-14494
  - CVE-2017-14495
  - CVE-2017-14496
  - CVE-2017-13704

  Each of these CVEs exposes a neutron based OpenStack deployment to
  various attacks such as leakage of sensitive memory information or
  causing a denial of service. Nodes are exposed to this risk by the
  crafting of various nefarious DNS or DHCP requests.

recommended-actions: >
  Operators should update the dnsmasq service using the affected nodes
  operating systems packaging tools to version 2.78 and later, or a
  distribution packaged version that contains relevant backports for these
  vulnerabilities.

