id: OSSN-0099

title: Denial of Service in Ironic under reduced process stack size

# Backfilled from git: merge date of the commit adding
# security-notes/OSSN-0099
date: '2026-06-05'

affected-services: ironic (>=32.0.0, <37.0.0)

summary: >
  An unauthenticated malicious user could submit a specially crafted
  JSON string to certain endpoints on the API service or the JSON-RPC
  endpoint if enabled, and cause a service crash until the service is
  restarted. This was due to the memory allocation exceeding the stack
  size of the Python runtime due to Ironic's reduced default stack size
  prior to the initial payload validation.

discussion: |
  The Ironic project has introduced a customized size check middleware
  which looks for excessive and invalid recursive JSON data structures
  while also enforcing path awareness and endpoint size limits based
  upon the intended patterns of interaction with Ironic.

recommended-actions: |
  Apply the provided Ironic patches.

  Review the newly provided configuration variables defaults in context of your cluster.
  Ironic services.

  Several options were added related to permitted JSON body sizing:

  - ``[api]/max_json_body_depth``, default 25, will reject requests with JSON documents with more recursion depth than this.

  - ``[api]/max_json_body_size``, default 1024, is the maximum size in KiB the API service will accept for any endpoint except the node provision state and continue_inspection endpoints. Requests with a larger content-length will receive an HTTP 413 response.

  - ``[api]/max_json_body_size_provision``, default 65536 (64MiB), is the max size in KiB for the node provision state endpoint.

  - ``[api]/max_json_body_size_inspection``, default 16384 (16MiB), is the max size in KiB for the continue_inspection endpoint.

  Operators unable or unwilling to patch their Ironic installations can work
  around the issue by increasing the process stack size by setting the
  environment variable ``IRONIC_THREAD_STACK_SIZE=8388608`` before starting Ironic services.

  **Patches:**

  The following reviews contain the fix for this issue:

  - 2026.2/hibiscus (master): https://review.opendev.org/c/openstack/ironic/+/991717
  - 2026.1/gazpacho: https://review.opendev.org/c/openstack/ironic/+/991854
  - 2025.2/flamingo: https://review.opendev.org/c/openstack/ironic/+/991858
  - bugfix/34.0: https://review.opendev.org/c/openstack/ironic/+/991856
  - bugfix/33.0: https://review.opendev.org/c/openstack/ironic/+/991857

