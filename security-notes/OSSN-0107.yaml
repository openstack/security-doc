id: OSSN-0107

title: Ironic Python Agent Container HardwareManager Security Misimplemented

# Backfilled from git: merge date of the commit adding
# security-notes/OSSN-0107
date: '2026-08-13'

affected-services: ironic-python-agent (>=11.0.0, <12.0.1)

summary: |
  Ironic Python Agent's ContainerHardwareManager plugin, shipped in
  2025.2, was merged with a misimplemented security model.

  Ironic developers have pushed an updated version of this feature, including
  patches for Ironic and Ironic Python Agent, with properly implemented
  security controls. These patches will not be universally backported as
  they are not backwards-compatible.

discussion: |
  The Ironic Python Agent uses plugins called HardwareManagers (HWMs) to
  expose new in-band steps for Ironic cleaning, servicing, or deployment.

  In the 2025.2 release, a Container HWM was added, giving operators who
  added a container runner (such as podman or docker) to their ramdisk
  the option to download and execute containers as Ironic steps.

  This initial implementation had several security flaws and was
  implemented in such a way that we could not backport fixes without
  breaking existing deployments. These issues included ignoring the value
  of the ``[container]/allow_arbitrary_containers`` safety mechanism.

recommended-actions: |
  - Operators who are using OpenStack-supplied ramdisks are not
    vulnerable. These images, for the impacted releases, do not come with
    podman or docker installed, disabling the feature. You are secure
    without taking any action and will upgrade into the fixed version in
    OpenStack 2026.2 or later.

  - Operators who are using ramdisks with docker or podman installed, for
    example, via the ``ironic-python-agent-podman`` element in
    ``ironic-python-agent-builder`` but are not interested in the
    Container HWM should add ``deploy.container_clean_step`` and
    ``deploy.generic_container_step`` to ``[api]/disallow_service_steps``,
    ``[api]/disallow_clean_steps``, and ``[api]/disallow_deploy_steps``.
    This will disable the insecure code. Patches to add the
    ``disallow_*_steps`` options are available in
    https://security.openstack.org/ossa/OSSA-2026-025.html

  - Operators currently using the Container HWM or who wish to use it
    should backport the patches from
    https://review.opendev.org/q/hashtag:%22container-hwm-patches%22
    to the branch they are currently using. Then, evaluate your use case
    against the updated documentation
    https://docs.openstack.org/ironic/latest/admin/container-based-steps.html
    to ensure the changes were not breaking for any existing deployment.

