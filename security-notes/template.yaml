id: OSSN-XXXX

title: Title (single sentence, no period)

affected-services: |
  - service-name (>=1.0.0 <1.2.3, >=2.0.0 <2.1.0)
  - other-service (>=3.0.0 <3.1.0)

summary: |
  A few sentences describing the issue at a high level. This deployment
  is *not* affected if the ``show_multiple_locations`` option is disabled.
  Deployments using ``neutron`` with the OVN ML2 driver are affected.

discussion: |
  A detailed discussion of the problem, covering what the vulnerability
  is, how it can be exploited, and what the impact is.

  The affected endpoints follow this pattern:

  - GET ``/v1/resource/{id}``
  - PUT ``/v1/resource/{id}``

  The following services are affected:

  - Nova (all configurations)
  - Cinder (only when using the LVMISCSIDriver)

    - The ``volume_driver`` option must be set to ``LVMISCSIDriver``
    - Deployments using other drivers are not affected

  The attack requires the following conditions to be true:

  1. The attacker has a valid project-scoped token.
  2. The attacker knows the target resource UUID.
  3. The ``show_multiple_locations`` option is set to ``True``.

  **Note:** This issue does *not* affect deployments using Neutron with
  the ML2/OVS driver. Only the OVN ML2 driver is affected.

recommended-actions: |
  Upgrade to a version containing the fix and restart the affected
  services. Set the following in ``/etc/nova/nova.conf``::

    [DEFAULT]
    debug = False

    [service]
    secure_option = True

  If upgrading is not immediately possible, apply the following
  workaround:

  1. Disable the affected feature::

       openstack feature disable affected-feature

  2. Verify the change took effect::

       openstack feature list

  3. Monitor logs for any exploitation attempts::

       grep "suspicious_pattern" /var/log/nova/nova-api.log

  **Warning:** Rolling back this workaround after applying the fix
  requires a service restart.

  **Patches:**

  - 2026.2/hibiscus (development): https://review.opendev.org/XXXXXX
  - 2026.1/gazpacho: https://review.opendev.org/XXXXXX
  - 2025.2/flamingo: https://review.opendev.org/XXXXXX
  - 2025.1/epoxy: https://review.opendev.org/XXXXXX

